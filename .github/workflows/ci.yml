name: CI Checks

on:
  # Mandatory: GitHub drops a workflow that has neither runs nor
  # workflow_dispatch, and a PR-only workflow can never revive itself
  # because no event reaches it. This froze CI here for three weeks.
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - dependabot/**

permissions:
  contents: read

concurrency:
  group: ci-checks-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: CI Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_PROGRESS_WHEN: never

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Run checks
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --quiet --all-targets --all-features -- -D warnings
          cargo machete
          cargo test --quiet

      - name: Run integration
        if: env.RUN_INTEGRATION == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.DEV_TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          cargo run --release --quiet
